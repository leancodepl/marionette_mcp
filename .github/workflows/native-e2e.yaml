name: Native lane E2E

# Device tests of the native lane (T-04): the MCP server and the CLI drive
# the example app on an Android emulator and an iOS Simulator. Run manually
# (e.g. before a release) — they need devices and take minutes, so they do
# not gate PRs. A nightly schedule can be added once runs are stable.

on:
  workflow_dispatch:

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      MARIONETTE_E2E_PLATFORM: android
      MARIONETTE_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the example app
        run: |
          flutter pub get
          cd example
          flutter build apk --debug

      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Each line runs in its own shell.
          script: |
            adb install -r example/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n com.example.counter/.MainActivity
            (cd packages/marionette_mcp && dart test -P device) && (cd packages/marionette_cli && dart test -P device)

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-android
          path: e2e-artifacts

  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      MARIONETTE_E2E_PLATFORM: ios
      MARIONETTE_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      # WebDriverAgent release built into the cache Marionette scans — the
      # one the native lane was verified with.
      WDA_REF: v16.15.0

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "MARIONETTE_E2E_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Cache WebDriverAgent
        id: wda-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/marionette_mcp/wda
          key: wda-${{ env.WDA_REF }}-${{ runner.os }}-${{ hashFiles('/Applications/Xcode.app/Contents/version.plist') }}

      - name: Build WebDriverAgent
        if: steps.wda-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WDA_REF" https://github.com/appium/WebDriverAgent.git /tmp/wda
          cd /tmp/wda
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "platform=iOS Simulator,id=$MARIONETTE_E2E_UDID" \
            -derivedDataPath ~/.cache/marionette_mcp/wda/DerivedData

      - name: Build and install the example app
        run: |
          flutter pub get
          cd example
          flutter build ios --simulator --debug
          xcrun simctl install "$MARIONETTE_E2E_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$MARIONETTE_E2E_UDID" com.example.counter

      - name: Run device tests
        run: |
          (cd packages/marionette_mcp && dart test -P device)
          (cd packages/marionette_cli && dart test -P device)

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-ios
          path: e2e-artifacts
