name: marionette_example
description: "Marionette MCP example app demonstrating call_custom_extension."
publish_to: "none"
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  marionette_flutter:
    path: ../packages/marionette_flutter
  marionette_logging:
    path: ../packages/marionette_logging
  logging: ^1.3.0
  permission_handler: 12.0.1
  image_picker: 1.1.2
  camera: 0.11.1
  google_maps_flutter: 2.12.1
  video_player: 2.10.0
  webview_flutter: 4.13.0
  file_picker: 10.3.7
  share_plus: 12.0.1
  # Unit 8 (§5, §7, §9, §11). Pinned to versions that resolve on the minimum
  # supported Flutter (3.27), like the rest of this workspace.
  app_tracking_transparency: 2.0.7
  flutter_local_notifications: 19.5.0
  flutter_web_auth_2: 5.1.0
  local_auth: 2.3.0
  timezone: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/webview_form.html
